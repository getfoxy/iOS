name: Foxy
options:
  bundleIdPrefix: io.getfoxi
  deploymentTarget:
    # iOS 17: the first where a proxy can be told never to fail over, so a
    # request that cannot reach Tor fails instead of going out without it.
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Foxy:
    type: application
    platform: iOS
    sources:
      # Includes PrivacyInfo.xcprivacy, which xcodegen copies into the app as a
      # resource (smoke check 21 confirms). No Info.plist here: it is generated
      # from the INFOPLIST_KEY_ settings below, and a Foxy/Info.plist, if one
      # appears, is picked up by xcodegen as INFOPLIST_FILE.
      - path: Foxy
      - path: Web
        type: folder
      # libsecp256k1 v0.8.0 from its signed tag (Vendor/README.md), compiled
      # here as C: the library, its precomputed tables and three of its optional
      # modules. Foxy/Keychain/NUT13.swift uses it for BIP-32's public keys and
      # key additions; Foxy/Nostr uses ecdh (the shared point NIP-44 hashes),
      # extrakeys and schnorrsig (BIP-340, which signs a Nostr event). The defines are written out so an upstream change of default
      # cannot change the build unseen: ECMULT_WINDOW_SIZE 15 and the source's
      # fallback comb table (11/6, 22 KiB; upstream's builds default to 43/6,
      # and both are constant-time). -O2 is its own build's level: unoptimised,
      # each key takes about ten times as long in a Debug build.
      # tools/nativetests/Package.swift compiles the same files the same way.
      - path: Vendor/secp256k1/src/secp256k1.c
        compilerFlags: "-O2 -DECMULT_WINDOW_SIZE=15 -DCOMB_BLOCKS=11 -DCOMB_TEETH=6 -DENABLE_MODULE_ECDH=1 -DENABLE_MODULE_EXTRAKEYS=1 -DENABLE_MODULE_SCHNORRSIG=1"
      - path: Vendor/secp256k1/src/precomputed_ecmult.c
        compilerFlags: "-O2 -DECMULT_WINDOW_SIZE=15 -DCOMB_BLOCKS=11 -DCOMB_TEETH=6 -DENABLE_MODULE_ECDH=1 -DENABLE_MODULE_EXTRAKEYS=1 -DENABLE_MODULE_SCHNORRSIG=1"
      - path: Vendor/secp256k1/src/precomputed_ecmult_gen.c
        compilerFlags: "-O2 -DECMULT_WINDOW_SIZE=15 -DCOMB_BLOCKS=11 -DCOMB_TEETH=6 -DENABLE_MODULE_ECDH=1 -DENABLE_MODULE_EXTRAKEYS=1 -DENABLE_MODULE_SCHNORRSIG=1"
    dependencies:
      # obfs4 and Snowflake. Static, built from source by tools/build-iptproxy.sh
      - framework: Vendor/IPtProxy.xcframework
        embed: false
      # Go's resolver (the netcgo build tag) calls res_9_*. IPtProxy's podspec
      # links this for CocoaPods users; linking the framework directly, we must.
      - sdk: libresolv.tbd
    # A shared scheme, generated with the project. Without it the scheme lived
    # in per-user files inside Foxy.xcodeproj and every xcodegen run deleted it.
    # Its test action runs FoxyTests (sh tools/unit-tests.sh).
    scheme:
      testTargets:
        - FoxyTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.getfoxi.foxy
        # The project is generated and never committed (.gitignore), so a team
        # chosen in Xcode's UI is lost the next time anyone runs xcodegen. It
        # comes from the environment, so no one's Apple team is in the
        # repository: put `export FOXY_DEVELOPMENT_TEAM=XXXXXXXXXX` in
        # `local.env` (ignored), then `. ./local.env && xcodegen generate`.
        # Unset is fine for the simulator and the tests, which sign nothing.
        DEVELOPMENT_TEAM: ${FOXY_DEVELOPMENT_TEAM}
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scanning mint and invoice QR codes.
        # Face ID unlocks Foxy and reads the seed from the keychain. Without this string
        # iOS refuses Face ID on a device; the simulator does not check, so it went unnoticed.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Face ID unlocks Foxy and your wallet's seed.
        # Tap to pay (TAP-TO-PAY.md). Asked the first time an invoice screen opens,
        # or TAP TO PAY is tapped; without it iOS kills the app on first use.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Foxy uses Bluetooth so a phone held next to yours can pay your invoice.
        # A card that holds ecash, read over NFC (Foxy/Flashcard). iOS asks no
        # question for NFC, but refuses to open a session without this string.
        INFOPLIST_KEY_NFCReaderUsageDescription: Foxy reads a card held to the phone, to be paid by it or to put money on it.
        # The one key that cannot be an INFOPLIST_KEY_ setting, because it is a
        # list: the card applet Foxy may speak to. Debug names a file of its own
        # below, which holds the same key and the foxy:// scheme.
        INFOPLIST_FILE: tools/app.plist
        # NFC Tag Reading is a capability a free Apple team cannot sign, so the
        # entitlement that claims it comes from the environment, like the team:
        # `export FOXY_ENTITLEMENTS=tools/flashcard.entitlements` in local.env.
        # Unset, Foxy builds as before and the card screens say NO CARD READER.
        CODE_SIGN_ENTITLEMENTS: ${FOXY_ENTITLEMENTS}
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_UIImageName: FoxySplash
        INFOPLIST_KEY_UILaunchScreen_UIImageRespectsSafeAreaInsets: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # canOpenURL answers false for any scheme not listed here, whether or
        # not the app is installed. Opening does not need this; asking does.
        TARGETED_DEVICE_FAMILY: "1"
        # import CSecp256k1: the module map over libsecp256k1's header
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/CSecp256k1
      configs:
        # The foxy:// scheme, Debug only.
        #
        # `xcrun simctl openurl booted "foxy://receive?amt=50&unit=sat"` puts a
        # simulator on a screen with an amount already on it, which otherwise
        # costs a dozen taps (DEVICE-TESTS.md, "Driving Foxy from outside";
        # WebHostController.receiveDeepLink). A URL that can drive a wallet to a
        # send screen is an attack surface and any app on the phone can open a
        # registered scheme, so it is registered in this configuration and no
        # other: Release names no INFOPLIST_FILE here, takes tools/app.plist
        # from the settings above, and so declares no CFBundleURLTypes. GENERATE_INFOPLIST_FILE stays on in both, and Xcode
        # merges the INFOPLIST_KEY_ settings above into this file, so the usage
        # strings, the launch screen and the scene manifest are the same either
        # way. The file is under tools/ rather than Foxy/ because everything
        # under Foxy/ is a source and would be copied into every bundle.
        Debug:
          INFOPLIST_FILE: tools/debug-url-scheme.plist

  # Swift unit tests: Route's host rules and approvals, the answer cap, the
  # bridge's action table and input checks, the native prompt queue, SeedVault's
  # rules, NUT-13 derived natively (NUT13Tests, against tests/fixtures). Hosted in Foxy.app, which xcodegen sets as TEST_HOST because of the
  # dependency; hosting them, a Debug Foxy touches no keychain, starts no Tor
  # and loads no page. Run with sh tools/unit-tests.sh.
  FoxyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FoxyTests
    dependencies:
      - target: Foxy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.getfoxi.foxy.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        # @testable import Foxy loads the modules Foxy imports, CSecp256k1 among them
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/CSecp256k1
