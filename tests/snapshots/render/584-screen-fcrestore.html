<!-- screen fcRestore -->
<div id="dc-root">
<div class="sc-host" data-sc-name="index">

<div data-foxy-app="1" data-foxy-theme="true" style="width: 100%; height: 100%; position: relative;">
<div data-foxy-theme="dark" style="height: 100%; position: relative; box-sizing: border-box; padding-bottom: 0px; transition: padding .16s ease; --acc-set: #E8622A; --acc-lt-set: #F79A3C; --acc-dk-set: #C24A1B; --acc-rgb-set: 232,98,42;">
<input type="text" tabindex="-1" aria-hidden="true" autocomplete="off" autocapitalize="off" spellcheck="false" style="position: fixed; left: 0px; bottom: 0px; width: 1px; height: 1px; padding: 0px; border: 0px; outline: none; opacity: 0; font-size: 16px; background: transparent; color: transparent; caret-color: transparent; pointer-events: none; z-index: -1;">
<div data-template="restore" style="height: 100%; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); font-family: SatSymbol, Figtree, system-ui, sans-serif; padding-top: 52px; box-sizing: border-box; animation: foxyIn .22s ease;">
<div style="flex: 0 0 auto; display: flex; align-items: center; padding: 4px 22px 0px;">
<div role="button" aria-label="Back" style="flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50%; border-top: 1px solid var(--lift-edge); display: flex; align-items: center; justify-content: center; cursor: pointer; box-sizing: border-box; box-shadow: inset 0 2px 0 var(--lift-edge),inset 0 -3px 0 var(--sink-edge),0 8px 16px rgba(0,0,0,.34);" class="scp0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M19.5 12H5m0 0 6-6m-6 6 6 6">
</path>
</svg>
</div>
</div>
<div style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 6px 24px 0px; padding: 0px 0px 18px; text-align: center; border-bottom: 1px solid rgba(var(--ink-rgb),.1);">
<div style="font-family: Sora, sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.01em; color: var(--ink);">RESTORE CARD</div>
<div style="font-family: Figtree, sans-serif; font-weight: 500; font-size: 20px; line-height: 1.3; color: var(--ink); text-wrap: balance;">You can reclaim the money on a card once it is unlocked.</div>
</div>
<div style="flex: 0 0 auto; padding: 22px 30px 10px; font-family: Sora, sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 0.12em; color: rgba(var(--ink-rgb),.5); text-align: center;">CARDS TIED TO YOUR PHONE</div>
<div style="flex: 1 1 0%; min-height: 0px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 0px 20px 30px; box-sizing: border-box;">
<div data-restore-note="" style="flex: 0 0 auto; padding: 18px 4px 0px; font-family: Figtree, sans-serif; font-weight: 500; font-size: 17px; line-height: 1.35; color: rgba(var(--ink-rgb),.55); text-align: center; text-wrap: pretty;">You can only restore money your card had the last time you connected it to this phone.</div>
</div>
</div>
<div style="position: absolute; left: 0px; right: 0px; top: 0px; z-index: 70; display: flex; justify-content: center; pointer-events: none; transform: translateY(-100%); opacity: 0; transition: transform .26s cubic-bezier(.2,.9,.25,1),opacity .2s ease;">
<div style="width: 100%; height: 108px; background: var(--acc); padding: 56px 24px 0px; box-sizing: border-box; box-shadow: 0 8px 26px rgba(0,0,0,.34); font-family: SatSymbol, Sora, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 0.02em; color: rgb(255, 255, 255); text-align: center; display: flex; align-items: center; justify-content: center;">

</span>
