<div id="dc-root">

<div data-shell="1" data-static="1" style="position: fixed; inset: 0px; display: flex; box-sizing: border-box; background: rgb(17, 18, 20); padding: 28px; min-height: 100vh; align-items: center;">
<div data-foxy-app="1" data-foxy-theme="true" style="width: 100%; height: 100%; position: relative;">
<div data-foxy-theme="dark" style="height: 100%; position: relative; box-sizing: border-box; padding-bottom: 0px; transition: padding .16s ease; --acc-set: #E8622A; --acc-lt-set: #F79A3C; --acc-dk-set: #C24A1B; --acc-rgb-set: 232,98,42;">
<input type="text" tabindex="-1" aria-hidden="true" autocomplete="off" autocapitalize="off" spellcheck="false" style="position: fixed; left: 0px; bottom: 0px; width: 1px; height: 1px; padding: 0px; border: 0px; outline: none; opacity: 0; font-size: 16px; background: transparent; color: transparent; caret-color: transparent; pointer-events: none; z-index: -1;">
<div style="position: absolute; left: 0px; right: 0px; top: 0px; z-index: 70; display: flex; justify-content: center; pointer-events: none; transform: translateY(-100%); opacity: 0; transition: transform .26s cubic-bezier(.2,.9,.25,1),opacity .2s ease;">
<div style="width: 100%; height: 108px; background: var(--acc); padding: 56px 24px 0px; box-sizing: border-box; box-shadow: 0 8px 26px rgba(0,0,0,.34); font-family: SatSymbol, Sora, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 0.02em; color: rgb(255, 255, 255); text-align: center; display: flex; align-items: center; justify-content: center;">

</span>
